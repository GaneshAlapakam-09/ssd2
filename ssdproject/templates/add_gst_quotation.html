<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>Add GST Quotation</title>
	{% load static %}
	<link rel="icon" type="image/x-icon" href="{% static 'images/SS_LOGO.webp' %}">
	<link rel="stylesheet" href="{% static 'fonts/font-awesome/css/font-awesome.min.css' %}">
	<link rel="stylesheet" href="{% static 'fonts/ionicons/css/ionicons.min.css' %}">
	<link rel="stylesheet" href="{% static 'styles/bootstrap.min.css' %}">
	<link rel="stylesheet" href="{% static 'styles/main.min.css' %}">
	
	<link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
	<link href='http://fonts.googleapis.com/css?family=Roboto:400,500,700,300' rel='stylesheet' type='text/css'>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<style>
		.inline-input { width: 100%; border: none; background: transparent; padding: 5px;}
		.inline-input:focus { outline: none; background: #f9f9f9; }
		textarea.inline-input { resize: none; overflow: hidden; min-height: 40px; }
		.table-totals { margin-top: 20px; font-weight: bold; }
		.form-horizontal .form-group { margin-left: 0; margin-right: 0; }
		.btn > i:before {margin:0}
	</style>
</head>
<body id="app" class="app off-canvas">
	<!-- header -->
	{% include 'includes/header.html'%}
	<!-- main-container -->
	<div class="main-container clearfix">
		<!-- main-navigation -->
		{% include 'includes/sidebar.html'%}
		<div class="content-container fixedHeader nav-expand">
			<div class="col-md-11">
				<div class="panel panel-lined panel-hovered mb20">
					<div class="panel-heading">Add GST Quotation</div>
					<div class="panel-body">
						<form id="gstQuotationForm" method="POST" action="{% url branch_url|add:':addgstquotation' %}">
							{% csrf_token %}
							<div class="row">
								<div class="col-md-6">
									<div class="form-group">
										<label>Customer</label>
										<select name="customer_id" id="customer_id" class="form-control" required>
											<option value="">Select Customer</option>
											{% for item in customers %}
												<option value="{% if item.Customer_Id %}{{item.Customer_Id}}{% else %}{{item.Agent_Id}}{% endif %}"
                                                    data-name="{{item.Customer_Name}}" data-address="{{item.Address}}" data-gstin="{{item.GSTIN}}">
													{{item.Customer_Name}} - {% if item.Customer_Id %}{{item.Customer_Id}}{% else %}{{item.Agent_Id}}{% endif %}
												</option>
											{% endfor %}
										</select>
									</div>
									<div class="form-group">
										<label>GSTIN</label>
										<input type="text" id="customer_gstin" name="customer_gstin" class="form-control" readonly placeholder="Customer GSTIN">
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<label>Date</label>
										<input type="date" name="quotation_date" class="form-control" required value="{% now 'Y-m-d' %}">
									</div>
									<div class="form-group">
										<label>Subject</label>
										<input type="text" name="subject" class="form-control" placeholder="Enter Subject">
									</div>
									<div class="form-group">
										<label>Reference</label>
										<input type="text" name="reference" class="form-control" placeholder="Enter Reference">
									</div>
									<div class="form-group">
										<label>Validity of Quotation</label>
										<input type="date" name="validity" class="form-control" placeholder="Enter Validity">
									</div>
								</div>
							</div>
							
							<div class="table-responsive mt20">
								<table class="table table-bordered" id="quotationTable">
									<thead>
										<tr>
											<th>S.No.</th>
											<th>DESCRIPTION</th>
											<th>Size</th>
											<th>Qty</th>
											<th>Sqft / Per Piece <br><strong>Price</strong></th>
											<th>Amount</th>
											<th>Action</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td class="sno">1</td>
											<td><textarea name="desc[]" class="inline-input" rows="2" required placeholder="Enter description..."></textarea></td>
											<td>
            <div style="display:flex; align-items:center;">
                <input type="number" step="0.01" class="inline-input size-len" placeholder="L" style="width: 45%; padding:2px;"> 
                <span style="margin: 0 3px;">x</span> 
                <input type="number" step="0.01" class="inline-input size-wid" placeholder="W" style="width: 45%; padding:2px;">
            </div>
            <input type="hidden" name="hsn[]" class="inline-input hsn-val">
        </td>
											<td><input type="number" step="0.01" name="qty[]" class="inline-input qty" value="1" required placeholder="0"></td>
											<td><input type="number" step="0.01" name="rate[]" class="inline-input rate" value="0" required placeholder="0.00"></td>
											<td><input type="number" step="0.01" name="amount[]" class="inline-input amount" value="0.00" placeholder="0.00"></td>
											<td><button type="button" class="btn btn-danger btn rmRow"><i class="fa fa-trash"></i></button></td>
										</tr>
									</tbody>
								</table>
								<div align="right">
								<button type="button" class="btn btn-success btn" id="addRow"><i class="fa fa-plus"></i></button>
								</div>
							</div>
							
							<div class="row table-totals">
								<div class="col-md-6"><input type="hidden" name="tax_type" value="SGST"></div>
								<div class="col-md-6 text-right">
									<p>TOTAL: <span id="subTotal">0.00</span></p>
									
                                    
                                    <input type="hidden" name="total_amount" id="h_subTotal" value="0">
                                    <input type="hidden" name="sgst_amount" id="h_sgstAmount" value="0">
                                    <input type="hidden" name="cgst_amount" id="h_cgstAmount" value="0">
                                    <input type="hidden" name="igst_amount" id="h_igstAmount" value="0">
                                    <input type="hidden" name="grand_total" id="h_grandTotal" value="0">
								</div>
							</div>
							
							<div class="text-right mt20">
								<button type="submit" class="btn btn-primary">Save Quotation</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- theme settings -->
	<div class="site-settings clearfix hidden-xs" >
		<div class="settings clearfix">
			<div class="trigger ion ion-settings left"></div>
			<div class="wrapper left">
				<ul class="list-unstyled other-settings">
					<li class="clearfix mb10">
						<div class="left small">Nav Horizontal</div>
						<div class="md-switch right">
							<label>
								<input type="checkbox" id="navHorizontal"> 
								<span>&nbsp;</span> 
							</label>
						</div>
					</li>
					<li class="clearfix mb10">
						<div class="left small">Fixed Header</div>
						<div class="md-switch right">
							<label>
								<input type="checkbox"  id="fixedHeader"> 
								<span>&nbsp;</span> 
							</label>
						</div>
					</li>
					<li class="clearfix mb10">
						<div class="left small">Nav Full</div>
						<div class="md-switch right">
							<label>
								<input type="checkbox"  id="navFull"> 
								<span>&nbsp;</span> 
							</label>
						</div>
					</li>
				</ul>
				<hr/>
				<ul class="themes list-unstyled" id="themeColor">
					<li data-theme="theme-zero"></li>
					<li data-theme="theme-one"></li>
					<li data-theme="theme-two"></li>
					<li data-theme="theme-three" class="active"></li>
					<li data-theme="theme-four"></li>
					<li data-theme="theme-five"></li>
					<li data-theme="theme-six"></li>
					<li data-theme="theme-seven"></li>
				</ul>
			</div>
		</div>
	</div>
	<!-- #end theme settings -->

	<script src="{% static 'scripts/vendors.js' %}"></script>
	<script src="{% static 'scripts/plugins/screenfull.js' %}"></script>
	<script src="{% static 'scripts/plugins/perfect-scrollbar.min.js' %}"></script>
	<script src="{% static 'scripts/plugins/waves.min.js' %}"></script>
	<script src="{% static 'scripts/app.js' %}"></script>
	<script>
		$(document).ready(function(){
            
            // Initialize existing sizes
            $('.hsn-val').each(function(){
                var val = $(this).val();
                if(val && val.toLowerCase().includes('x')){
                    var parts = val.toLowerCase().split('x');
                    $(this).closest('tr').find('.size-len').val(parts[0].trim());
                    $(this).closest('tr').find('.size-wid').val(parts[1].trim());
                }
            });

            // Bind events for size fields as well
            $(document).on('input', '.size-len, .size-wid', function() {
                var tr = $(this).closest('tr');
                var l = tr.find('.size-len').val() || '';
                var w = tr.find('.size-wid').val() || '';
                var combined = (l && w) ? l + ' X ' + w : (l || w);
                tr.find('.hsn-val').val(combined);
            });
            
            $(document).on('input', '.amount', function(){
                calculateTotals();
            });

            function calculateTotals() {
                var subTotal = 0;
                $('#quotationTable tbody tr').each(function(){
                    var amt = parseFloat($(this).find('.amount').val()) || 0;
                    subTotal += amt;
                });
                
                $('#subTotal').text(subTotal.toFixed(2));
                $('#h_subTotal').val(subTotal.toFixed(2));
                $('#h_grandTotal').val(subTotal.toFixed(2)); // Grand total is same as subtotal now
            }

            
            function updateSno() {
                $('#quotationTable tbody tr').each(function(index){
                    $(this).find('.sno').text(index + 1);
                });
            }

            $('#addRow').click(function(){
                var tr = `<tr>
                            <td class="sno"></td>
                            <td><textarea name="desc[]" class="inline-input" rows="2" required placeholder="Enter description..."></textarea></td>
                            <td>
            <div style="display:flex; align-items:center;">
                <input type="number" step="0.01" class="inline-input size-len" placeholder="L" style="width: 45%; padding:2px;"> 
                <span style="margin: 0 3px;">x</span> 
                <input type="number" step="0.01" class="inline-input size-wid" placeholder="W" style="width: 45%; padding:2px;">
            </div>
            <input type="hidden" name="hsn[]" class="inline-input hsn-val">
        </td>
                            <td><input type="number" step="0.01" name="qty[]" class="inline-input qty" value="1" required placeholder="0"></td>
                            <td><input type="number" step="0.01" name="rate[]" class="inline-input rate" value="0" required placeholder="0.00"></td>
                            <td><input type="number" name="amount[]" class="inline-input amount" value="0.00" placeholder="0.00"></td>
                            <td><button type="button" class="btn btn-danger btn rmRow"><i class="fa fa-trash"></i></button></td>
                          </tr>`;
                $('#quotationTable tbody').append(tr);
                updateSno();
            });
            
            $(document).on('click', '.rmRow', function(){
                $(this).closest('tr').remove();
                updateSno();
                calculateTotals();
            });
            
            $(document).on('input', '.qty, .rate', function(){
                calculateTotals();
            });
            
            $(document).on('input', 'textarea[name="desc[]"]', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
            
            $('input[name="tax_type"]').change(function(){
                calculateTotals();
            });
            
            $('#customer_id').change(function(){
                var gstin = $(this).find(':selected').data('gstin');
                if(gstin && gstin != 'None' && gstin != 'null') {
                    $('#customer_gstin').val(gstin);
                } else {
                    $('#customer_gstin').val('');
                }
            });
		});
	</script>
</body>
</html>

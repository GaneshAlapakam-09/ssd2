<script>
	$(function () {
		"use strict";
	
		function toggleBasicTableFns() {
			var $btable = $(".basic-table");
			var btns = [".btable-bordered", ".btable-striped", ".btable-condensed", ".btable-hover"];
	
			btns.forEach(function (btn) {
				$btable.find(btn).on("click touchstart", function (e) {
					var tableClass = $(this).data("table-class");
					e.preventDefault();
					$(this).toggleClass("active");
					$btable.find("table").toggleClass(tableClass);
				});
			});
		}
	
		function initDataTable() {
			var $dataTable = $(".data-table");
			var $table = $dataTable.find("table");
	
			var datas = [
				{% for item in data %}
				{ 
					Payment_Id: "{{ item.Payment_Id|escapejs }}", 
					Grand_Total: "{{ item.Grand_Total|escapejs }}", 
					Pending_Amount: "{{ item.Pending_Amount|escapejs }}", 
					Paid_Amount: "{{ item.Paid_Amount|escapejs }}", 
					action: `<div class="btn-group list-cust">
								<a title="Ganerate Invoice" href="{% url 'invoice' item.Payment_Id %}"><button type="button" class="btn btn-default ion icon ion-md-paper"></button></a>
								<a title="List Payments" href="{% url branch_url|add:':paymentterms' item.Payment_Id %}"><button type="button" class="btn btn-default ion icon ion-md-list"></button></a> 
								{% comment %} <a title="Add Payment" href="#"><button type="button" class="btn btn-default ion icon ion-md-cash"></button></a>  {% endcomment %}
								{% comment %} <a class="del-btn" href=""><button type="button" class="btn btn-default ion icon ion-md-cash waves-effect"></button></a> {% endcomment %}
							</div>`
				}{% if not loop.last %},{% endif %}
				{% endfor %}
			];
	
			var table = $table.DataTable({
				data: datas,
				columns: [
					{ data: "Payment_Id" },
					{ data: "Grand_Total" },
					{ data: "Pending_Amount" },
					{ data: "Paid_Amount" },
					{ data: "action" }
				],
				searching: true,
				dom: "rtip",
				pageLength: 10,
				order: [[0, "desc"]]
			});
	
			$dataTable.find(".searchInput").on("keyup", function () {
				table.search(this.value).draw();
			});
	
			$dataTable.find(".lengthSelect").on("change", function () {
				table.page.len(this.value).draw();
			});
	
			$dataTable.find(".dataTables_info").css({
				"margin-left": "20px",
				"font-size": "12px"
			});
	
			// Confirmation alert before deleting
			$(document).on("click", ".del-btn", function (e) {
				e.preventDefault(); // Prevent default navigation
				var deleteUrl = $(this).attr("href");
				if (confirm("Are you sure you want to delete this Item?")) {
					window.location.href = deleteUrl; // Proceed with deletion
				}
			});
		}
	
		function _init() {
			toggleBasicTableFns();
			initDataTable();
		}
	
		_init();
	});
	

</script>
